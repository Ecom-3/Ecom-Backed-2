spring:
  profiles:
    active: prod
  application:
    name: alerts-service
  config:
    import: "optional:configserver:${CONFIG_SERVER_URL:http://localhost:58888}"

eureka:
  client:
    service-url:
      defaultZone: "${EUREKA_SERVER_URL:http://localhost:58761/eureka}"

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: ${spring.application.name}
