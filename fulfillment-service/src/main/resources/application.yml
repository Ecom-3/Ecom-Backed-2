server:
  port: 53315
app:
  jwt:
    secret: "${JWT_SECRET:change-this-secret-to-a-long-random-string}"
    issuer: org-access
spring:
  profiles:
    active: prod
  application:
    name: fulfillment-service
  config:
    import: "optional:configserver:${CONFIG_SERVER_URL:http://localhost:58888}"
  sql:
    init:
      mode: never

  datasource:
    url: "jdbc:mysql://localhost:3306/fulfillment-service?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true"
    username: "root"
    password: "root"
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

  flyway:
    enabled: false
    baseline-on-migrate: true
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:58761/eureka}
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  metrics:
    tags:
      application: ${spring.application.name}

sync:
  service: fulfillment-service
  keys:
    order-service: ${ORDER_SYNC_KEY:}
    payment-service: ${PAYMENT_SYNC_KEY:}
    fulfillment-service: ${FULFILLMENT_SYNC_KEY:}
  targets:
    order-service: ${ORDER_SERVICE_URL:http://localhost:53311}
    payment-service: ${PAYMENT_SERVICE_URL:http://localhost:53314}
    fulfillment-service: ${FULFILLMENT_SERVICE_URL:http://localhost:53315}
    notification-service: ${NOTIFICATION_SERVICE_URL:http://localhost:53317}
  routes:
    fulfillment: notification-service
